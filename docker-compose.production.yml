# Production stack. Routing and TLS come from the shared proxy, which must be
# running first (see ../proxy/docker-compose.production.yml).
#
# The public hostname is APP_URL_TRAEFIK in .env — change that one value and
# the DNS record to move the app to a different domain. Nothing else is
# domain-specific.
#
#   docker compose -f docker-compose.production.yml build
#   docker compose -f docker-compose.production.yml up -d
#   docker compose -f docker-compose.production.yml exec app php artisan migrate --force
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: "${DOCKER_CONTAINER_NAME}-app:latest"
    container_name: "${DOCKER_CONTAINER_NAME}_app"
    restart: unless-stopped
    env_file: .env
    environment:
      - "DB_HOST=database"
      - "DB_PORT=3306"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
    volumes:
      - storage:/var/www/storage
    networks:
      - network
      - proxy
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.${DOCKER_CONTAINER_NAME}.rule=Host(`${APP_URL_TRAEFIK}`)"
      - "traefik.http.routers.${DOCKER_CONTAINER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${DOCKER_CONTAINER_NAME}.tls=true"
      - "traefik.http.routers.${DOCKER_CONTAINER_NAME}.tls.certresolver=le"
      - "traefik.http.routers.${DOCKER_CONTAINER_NAME}.middlewares=security-headers@file"
      - "traefik.http.services.${DOCKER_CONTAINER_NAME}.loadbalancer.server.port=80"
      - "traefik.http.services.${DOCKER_CONTAINER_NAME}.loadbalancer.serversTransport=longTimeout@file"

  database:
    image: mysql:8.4
    container_name: "${DOCKER_CONTAINER_NAME}_database"
    restart: unless-stopped
    command: --mysql-native-password=OFF
    # No published ports — reachable only on the internal network.
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      - "MYSQL_DATABASE=${DB_DATABASE}"
      - "MYSQL_USER=${DB_USERNAME}"
      - "MYSQL_PASSWORD=${DB_PASSWORD}"
      - "MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}"
    networks:
      - network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:8-alpine
    container_name: "${DOCKER_CONTAINER_NAME}_redis"
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    volumes:
      - redisdata:/data
    networks:
      - network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  queue:
    image: "${DOCKER_CONTAINER_NAME}-app:latest"
    container_name: "${DOCKER_CONTAINER_NAME}_queue"
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=300", "--max-time=3600"]
    env_file: .env
    environment:
      - "DB_HOST=database"
      - "DB_PORT=3306"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
    volumes:
      - storage:/var/www/storage
    networks:
      - network
    depends_on:
      app:
        condition: service_started
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: "${DOCKER_CONTAINER_NAME}-app:latest"
    container_name: "${DOCKER_CONTAINER_NAME}_scheduler"
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    env_file: .env
    environment:
      - "DB_HOST=database"
      - "DB_PORT=3306"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
    volumes:
      - storage:/var/www/storage
    networks:
      - network
    depends_on:
      app:
        condition: service_started
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  dbdata:
  redisdata:
  storage:

networks:
  network:
    name: "${DOCKER_CONTAINER_NAME}_network"
    driver: bridge
  proxy:
    name: proxy
    external: true
