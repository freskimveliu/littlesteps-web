---
# =============================================================================
# Little Steps — configure the server and run the stack
# =============================================================================
# Idempotent. This is both the first-run configuration and the way every later
# change is applied. It assumes a fresh Ubuntu 24.04 box (create-and-setup-ec2.yml
# makes one) and installs everything it needs.
#
#   ./apply.sh              # against SERVER_IP from .env
#   ./setup.sh              # provision a new instance, then run this
#
# What it does:
#   - installs Docker, UFW and Fail2ban, and adds a swapfile
#   - deploys the shared proxy from ../proxy to /opt/proxy (Traefik, Let's Encrypt)
#   - writes /opt/littlesteps: laravel/.env, docker-compose.yml, deploy.sh
#   - installs a deploy webhook on port 9000, reachable only from Docker
#   - pulls the image from GHCR, migrates, and starts the stack
# =============================================================================

- name: "Configure the server and deploy Little Steps"
  hosts: littlesteps
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/littlesteps
    proxy_dir: /opt/proxy
    proxy_src: "{{ playbook_dir }}/../../../proxy"

    domain: "{{ lookup('env', 'LITTLESTEPS_DOMAIN') | default('littlesteps.freskimveliu.dev', true) }}"
    acme_email: "{{ lookup('env', 'ACME_EMAIL') | default('freskim.veliu@gmail.com', true) }}"

    image_tag: "{{ lookup('env', 'DOCKER_IMAGE_TAG') | default('main', true) }}"
    app_key: "{{ lookup('env', 'APP_KEY') }}"

    db_database: littlesteps
    db_username: littlesteps
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
    db_root_password: "{{ lookup('env', 'DB_ROOT_PASSWORD') }}"
    redis_password: "{{ lookup('env', 'REDIS_PASSWORD') }}"

    github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
    github_username: "{{ lookup('env', 'GITHUB_USERNAME') | default('freskimveliu', true) }}"

    deploy_webhook_secret: "{{ lookup('env', 'DEPLOY_WEBHOOK_SECRET') }}"
    webhook_port: "{{ lookup('env', 'WEBHOOK_PORT') | default('9000', true) }}"

    create_swapfile: "{{ (lookup('env', 'CREATE_SWAPFILE') | default('true', true)) | bool }}"

  tasks:
    # -------------------------------------------------------------------------
    # Preflight
    # -------------------------------------------------------------------------
    - name: Fail early if a required value is missing
      ansible.builtin.assert:
        that:
          - app_key | length > 0
          - app_key is match('^base64:')
          - db_password | length > 0
          - db_root_password | length > 0
          - redis_password | length > 0
          - github_token | length > 0
          - deploy_webhook_secret | length > 0
        fail_msg: >-
          One or more values are missing from deploy/ansible/.env. APP_KEY must
          be a fresh `base64:...` key (artisan key:generate --show), and the
          database, Redis, GitHub and webhook values must all be filled in.
        quiet: true

    - name: Check that the proxy repo is next to this one
      ansible.builtin.stat:
        path: "{{ proxy_src }}/docker-compose.production.yml"
      delegate_to: localhost
      become: false
      register: proxy_repo

    - name: Fail if the proxy repo is missing
      ansible.builtin.fail:
        msg: >-
          {{ proxy_src }} does not look like the proxy repo — expected
          docker-compose.production.yml in it. Traefik and the certificates come
          from there; clone it next to this repo and run again.
      when: not proxy_repo.stat.exists

    # -------------------------------------------------------------------------
    # Base system
    # -------------------------------------------------------------------------
    - name: Update the apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - jq
          - unzip
          - ufw
          - fail2ban
          - python3
        state: present

    - name: Add the Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add the Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: true

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let the ubuntu user run docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    # -------------------------------------------------------------------------
    # Firewall — only SSH, HTTP and HTTPS from the internet
    # -------------------------------------------------------------------------
    - name: UFW — allow SSH, HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ['22', '80', '443']

    - name: UFW — allow the deploy webhook from the Docker network only
      community.general.ufw:
        rule: allow
        port: "{{ webhook_port }}"
        from_ip: "172.16.0.0/12"
        comment: "Deploy webhook, Docker network only"

    - name: UFW — enable with a default deny
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Enable Fail2ban (its default sshd jail)
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # -------------------------------------------------------------------------
    # Swap — MySQL, Redis, PHP-FPM and Traefik on a 2 GB instance
    # -------------------------------------------------------------------------
    - name: Check for an existing swapfile
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile
      when: create_swapfile

    - name: Create a 2 GB swapfile
      when: create_swapfile and not (swapfile.stat.exists | default(false))
      block:
        - name: Allocate the swapfile
          ansible.builtin.command: fallocate -l 2G /swapfile
          args:
            creates: /swapfile

        - name: Restrict swapfile permissions
          ansible.builtin.file:
            path: /swapfile
            mode: '0600'

        - name: Format the swapfile
          ansible.builtin.command: mkswap /swapfile
          register: mkswap
          changed_when: mkswap.rc == 0

        - name: Enable the swapfile
          ansible.builtin.command: swapon /swapfile
          register: swapon
          changed_when: swapon.rc == 0
          failed_when: swapon.rc != 0 and 'already active' not in swapon.stderr

        - name: Persist the swapfile in /etc/fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            line: "/swapfile none swap sw 0 0"
            state: present

        - name: Lower swappiness so swap is a safety net, not a first resort
          ansible.posix.sysctl:
            name: vm.swappiness
            value: '10'
            state: present
            sysctl_file: /etc/sysctl.d/99-swappiness.conf
            reload: true

    # -------------------------------------------------------------------------
    # The shared proxy — Traefik, from ../proxy
    # -------------------------------------------------------------------------
    - name: Create the proxy directory
      ansible.builtin.file:
        path: "{{ proxy_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy the proxy stack
      ansible.builtin.copy:
        src: "{{ proxy_src }}/{{ item.src }}"
        dest: "{{ proxy_dir }}/{{ item.dest }}"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      loop:
        - { src: docker-compose.production.yml, dest: docker-compose.yml }
        - { src: traefik.production.yaml, dest: traefik.production.yaml }
        - { src: dynamic_conf.production.yaml, dest: dynamic_conf.production.yaml }
      register: proxy_files

    - name: Write the proxy environment file
      ansible.builtin.copy:
        dest: "{{ proxy_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        content: |
          # Address Let's Encrypt sends expiry warnings to.
          ACME_EMAIL={{ acme_email }}
      register: proxy_env

    - name: Create the proxy Docker network
      ansible.builtin.command: docker network create proxy
      register: proxy_network
      changed_when: proxy_network.rc == 0
      failed_when: proxy_network.rc != 0 and 'already exists' not in proxy_network.stderr

    - name: Start the proxy
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ proxy_dir }}"
      register: proxy_up
      changed_when: "'Started' in proxy_up.stderr or 'Created' in proxy_up.stderr"

    # -------------------------------------------------------------------------
    # Application directories
    # -------------------------------------------------------------------------
    - name: Create the application directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/scripts"
        - "{{ app_dir }}/data/mysql"
        - "{{ app_dir }}/data/redis"
        - "{{ app_dir }}/laravel/storage/logs"
        - "{{ app_dir }}/laravel/storage/framework/cache/data"
        - "{{ app_dir }}/laravel/storage/framework/sessions"
        - "{{ app_dir }}/laravel/storage/framework/views"
        - "{{ app_dir }}/laravel/storage/app/public"

    # -------------------------------------------------------------------------
    # Configuration
    # -------------------------------------------------------------------------
    - name: Write laravel/.env
      ansible.builtin.copy:
        dest: "{{ app_dir }}/laravel/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'
        content: |
          APP_NAME="Little Steps"
          APP_ENV=production
          APP_KEY={{ app_key }}
          APP_DEBUG=false
          APP_URL=https://{{ domain }}
          ASSET_URL=https://{{ domain }}

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US
          APP_MAINTENANCE_DRIVER=file

          BCRYPT_ROUNDS=12

          # Traefik terminates TLS and forwards plain HTTP.
          TRUSTED_PROXIES=*

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=database
          DB_PORT=3306
          DB_DATABASE={{ db_database }}
          DB_USERNAME={{ db_username }}
          DB_PASSWORD={{ db_password }}

          SESSION_DRIVER=redis
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=redis
          CACHE_STORE=redis

          REDIS_CLIENT=phpredis
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD={{ redis_password }}

          MAIL_MAILER=log
          MAIL_FROM_ADDRESS="hello@{{ domain }}"
          MAIL_FROM_NAME="${APP_NAME}"
      no_log: true

    # Compose reads its variables from the .env next to the compose file, not
    # from laravel/.env. DOCKER_IMAGE_TAG here is what decides which build runs.
    - name: Write the compose environment file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'
        content: |
          # Which image tag runs. `main` is the newest build of the main branch;
          # set a commit SHA to pin or roll back, then:
          #   docker compose up -d --no-deps app
          DOCKER_IMAGE_TAG={{ image_tag }}

          APP_HOST={{ domain }}

          DB_DATABASE={{ db_database }}
          DB_USERNAME={{ db_username }}
          DB_PASSWORD={{ db_password }}
          DB_ROOT_PASSWORD={{ db_root_password }}

          REDIS_PASSWORD={{ redis_password }}
      no_log: true

    - name: Write docker-compose.yml
      ansible.builtin.copy:
        src: ../docker-compose.server.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    # -------------------------------------------------------------------------
    # Deploy script + webhook
    # -------------------------------------------------------------------------
    - name: Write deploy.sh
      ansible.builtin.copy:
        dest: "{{ app_dir }}/scripts/deploy.sh"
        mode: '0755'
        content: |
          #!/bin/bash
          # Pulls the newest image, migrates, and swaps the containers.
          # Written by deploy/ansible/deploy-littlesteps.yml — do not edit here.
          set -e

          cd {{ app_dir }}

          echo "$(date): Starting deployment..."

          # Only restart the workers that were running, so a deliberate
          # `docker compose stop queue` survives a deploy.
          WORKERS=$(docker compose ps --services --status running 2>/dev/null \
              | grep -E '^(queue|scheduler)$' | tr '\n' ' ')

          echo "Pulling latest image..."
          docker compose pull app queue scheduler

          echo "Running database migrations..."
          docker compose run --rm app php artisan migrate --force

          echo "Starting new app container..."
          docker compose up -d --no-deps app

          echo "Waiting for the app to become healthy..."
          HEALTHY=0
          for i in $(seq 1 45); do
              STATUS=$(docker inspect littlesteps_app --format='{{ "{{" }}.State.Health.Status{{ "}}" }}' 2>/dev/null || echo 'starting')
              echo "  Health status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                  HEALTHY=1
                  break
              fi
              sleep 2
          done

          if [ "$HEALTHY" != "1" ]; then
              echo "App did not become healthy — the workers stay on the previous image."
              docker compose logs app --tail=50
              exit 1
          fi

          if [ -n "$WORKERS" ]; then
              echo "Restarting workers:$WORKERS"
              # shellcheck disable=SC2086
              docker compose up -d --no-deps $WORKERS
          else
              echo "No worker containers were running — leaving them stopped."
          fi

          echo "Pruning old images..."
          docker image prune -f

          echo "$(date): Deployment completed successfully!"

    - name: Write webhook-server.py
      ansible.builtin.copy:
        dest: "{{ app_dir }}/scripts/webhook-server.py"
        mode: '0755'
        content: |
          #!/usr/bin/env python3
          """
          Deployment webhook for Little Steps.

          Listens on WEBHOOK_PORT and runs deploy.sh for an HMAC-signed POST to
          /deploy. Traefik is the only thing that can reach it — UFW restricts
          the port to the Docker network.
          """
          import http.server
          import hmac
          import hashlib
          import os
          import subprocess
          import logging

          logging.basicConfig(
              level=logging.INFO,
              format='%(asctime)s - %(levelname)s - %(message)s',
              handlers=[
                  logging.FileHandler('/var/log/littlesteps-deploy-webhook.log'),
                  logging.StreamHandler()
              ]
          )

          WEBHOOK_SECRET = os.environ.get('DEPLOY_WEBHOOK_SECRET', '')
          DEPLOY_SCRIPT = '{{ app_dir }}/scripts/deploy.sh'
          PORT = {{ webhook_port }}


          class WebhookHandler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path != '/deploy':
                      self.send_response(404)
                      self.end_headers()
                      return

                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length)

                  signature = self.headers.get('X-Hub-Signature-256', '')
                  if not self.verify_signature(body, signature):
                      logging.warning('Invalid signature received')
                      self.send_response(401)
                      self.end_headers()
                      self.wfile.write(b'Invalid signature')
                      return

                  logging.info('Valid webhook received, starting deployment...')
                  try:
                      result = subprocess.run(
                          [DEPLOY_SCRIPT],
                          capture_output=True,
                          text=True,
                          timeout=600
                      )
                      logging.info(f'Deploy stdout: {result.stdout}')
                      if result.stderr:
                          logging.error(f'Deploy stderr: {result.stderr}')

                      if result.returncode != 0:
                          self.send_response(500)
                          self.end_headers()
                          self.wfile.write(b'Deployment failed')
                          return

                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b'Deployment triggered')
                  except Exception as e:
                      logging.error(f'Deployment failed: {e}')
                      self.send_response(500)
                      self.end_headers()
                      self.wfile.write(str(e).encode())

              def verify_signature(self, payload, signature):
                  # No secret means reject everything, not allow everything.
                  if not WEBHOOK_SECRET or not signature:
                      return False
                  expected = 'sha256=' + hmac.new(
                      WEBHOOK_SECRET.encode(),
                      payload,
                      hashlib.sha256
                  ).hexdigest()
                  return hmac.compare_digest(expected, signature)

              def log_message(self, format, *args):
                  logging.info(f'{self.address_string()} - {format % args}')


          if __name__ == '__main__':
              server = http.server.HTTPServer(('0.0.0.0', PORT), WebhookHandler)
              logging.info(f'Little Steps webhook server listening on port {PORT}')
              server.serve_forever()

    - name: Install the deploy-webhook systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/littlesteps-deploy-webhook.service
        mode: '0644'
        content: |
          [Unit]
          Description=Little Steps Deployment Webhook Server
          After=network.target docker.service
          Requires=docker.service

          [Service]
          Type=simple
          Restart=always
          RestartSec=5
          User=root
          WorkingDirectory={{ app_dir }}
          Environment="DEPLOY_WEBHOOK_SECRET={{ deploy_webhook_secret }}"
          ExecStart=/usr/bin/python3 {{ app_dir }}/scripts/webhook-server.py
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
      no_log: true
      register: webhook_service

    - name: Enable and (re)start the webhook service
      ansible.builtin.systemd:
        name: littlesteps-deploy-webhook
        state: "{{ 'restarted' if webhook_service.changed else 'started' }}"
        daemon_reload: true
        enabled: true

    # -------------------------------------------------------------------------
    # Bring it up
    # -------------------------------------------------------------------------
    - name: Log in to the GitHub Container Registry (ubuntu)
      ansible.builtin.shell: |
        echo "{{ github_token }}" | docker login ghcr.io -u "{{ github_username }}" --password-stdin
      become_user: ubuntu
      no_log: true
      changed_when: true

    - name: Log in to the GitHub Container Registry (root, used by the webhook)
      ansible.builtin.shell: |
        echo "{{ github_token }}" | docker login ghcr.io -u "{{ github_username }}" --password-stdin
      no_log: true
      changed_when: true

    - name: Pull the images
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Start the database and Redis
      ansible.builtin.command: docker compose up -d database redis
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Run database migrations
      ansible.builtin.command: docker compose run --rm app php artisan migrate --force
      args:
        chdir: "{{ app_dir }}"
      register: migrate
      changed_when: "'Nothing to migrate' not in migrate.stdout"

    - name: Start the rest of the stack
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Wait for the app to report healthy
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Health.Status{{ "}}" }}' littlesteps_app
      register: health
      until: health.stdout | trim == 'healthy'
      retries: 30
      delay: 5
      changed_when: false

    - name: Show container status
      ansible.builtin.command: docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}"
      register: docker_status
      changed_when: false

    - name: Done
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "Little Steps is deployed."
          - "============================================"
          - "{{ docker_status.stdout_lines }}"
          - ""
          - "URL       : https://{{ domain }}"
          - "Admin     : https://{{ domain }}/admin"
          - "Health    : https://{{ domain }}/up"
          - "Directory : {{ app_dir }}"
          - ""
          - "If HTTPS fails, check that {{ domain }} resolves to this server —"
          - "Traefik gets the certificate over HTTP-01 on the first request."
          - "============================================"
