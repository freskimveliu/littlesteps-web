; Memory overrides for the shared vault box (t3.small, 2 GB, no dedicated
; headroom). The image sets memory_limit = 1024M, which is a sensible default
; on a machine of our own and a loaded gun on this one: a single request that
; runs away can exhaust the host and the OOM killer will not necessarily pick
; our container.
;
; 384M is chosen to still fit an in-request media conversion. Spatie's
; conversions are all nonQueued() today, so they decode inside the PHP-FPM
; worker: a 6000x4000 JPEG is ~96 MB raw, and the conversion needs room for
; source and destination at once. Lower this only after those move to the
; queue container.
;
; Mounted read-only at /usr/local/etc/php/conf.d/zz-server.ini. The `zz-`
; prefix makes it load last, after the image's own app.ini.
memory_limit = 384M
