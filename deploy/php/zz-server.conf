; PHP-FPM pool sizing for the shared vault box.
;
; The official php:fpm image leaves the upstream default of pm.max_children = 5
; with memory_limit = 1024M. That combination can ask for more memory than the
; whole machine has. Four workers at the 384M ceiling from zz-server.ini is
; still more than the container's mem_limit allows, but in practice a warm
; Laravel worker sits at 60-80 MB, so this is ~320 MB steady state.
;
; Redefining [www] here is the same trick the image itself uses in
; zz-docker.conf — later files in /usr/local/etc/php-fpm.d/ win, and
; "zz-server" sorts after "zz-docker".
;
; Little Steps is a low-traffic app sharing a box with vault. If requests start
; queueing (look for "server reached pm.max_children" in the container logs),
; the box needs to grow before this number does.
[www]
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recycle workers periodically so a slow leak cannot accumulate across days.
pm.max_requests = 500
